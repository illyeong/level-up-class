<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LevelUp Class 위젯</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="titlebar">
        <div class="drag-area">
          <div class="brand-mark">Lv</div>
          <div>
            <div class="title">LevelUp Class</div>
            <div class="subtitle">교사용 미니 위젯</div>
          </div>
        </div>
        <div class="window-actions">
          <button id="pinBtn" class="icon-btn" title="항상 위">P</button>
          <button id="minBtn" class="icon-btn" title="최소화">-</button>
          <button id="closeBtn" class="icon-btn danger" title="닫기">x</button>
        </div>
      </header>

      <main class="content">
        <section id="setupPanel" class="panel setup-panel hidden">
          <div class="panel-title">위젯 연결</div>
          <p class="help">
            처음 한 번만 학급 ID 또는 teacherUid를 저장하면 Firestore에서 학급 현황을 읽어옵니다.
          </p>
          <label>
            <span>학급 ID</span>
            <input id="classIdInput" autocomplete="off" placeholder="예: classes 문서 ID" />
          </label>
          <label>
            <span>teacherUid</span>
            <input id="teacherUidInput" autocomplete="off" placeholder="예: admin_master_001" />
          </label>
          <label>
            <span>웹앱 주소</span>
            <input id="webUrlInput" autocomplete="off" value="https://level-up-class.vercel.app" />
          </label>
          <button id="saveSettingsBtn" class="primary-btn">저장하고 불러오기</button>
        </section>

        <section id="dashboardPanel" class="hidden">
          <div class="class-card">
            <div>
              <div id="className" class="class-name">학급 불러오는 중</div>
              <div id="classMeta" class="class-meta">-</div>
            </div>
            <button id="settingsBtn" class="small-btn">설정</button>
          </div>

          <div class="quick-row">
            <button data-open="dashboard" class="quick-btn">웹 대시보드</button>
            <button data-open="quest" class="quick-btn">퀘스트</button>
            <button data-open="note" class="quick-btn">배움노트</button>
          </div>

          <section class="metric-grid">
            <article class="metric-card blue">
              <div class="metric-label">학생 수</div>
              <div id="studentCount" class="metric-value">-</div>
            </article>
            <article class="metric-card amber">
              <div class="metric-label">오늘 퀘스트</div>
              <div id="questToday" class="metric-value">-</div>
            </article>
            <article class="metric-card rose">
              <div class="metric-label">승인 대기</div>
              <div id="pendingNotes" class="metric-value">-</div>
            </article>
            <article class="metric-card emerald">
              <div class="metric-label">오늘 활동</div>
              <div id="todayActivity" class="metric-value">-</div>
            </article>
          </section>

          <section class="panel">
            <div class="section-head">
              <div>
                <div class="panel-title">지금 확인할 일</div>
                <div id="lastUpdated" class="caption">-</div>
              </div>
              <button id="refreshBtn" class="small-btn">새로고침</button>
            </div>
            <div id="todoList" class="todo-list"></div>
          </section>

          <section class="panel">
            <div class="panel-title">진행 중인 보스레이드</div>
            <div id="raidList" class="raid-list"></div>
          </section>

          <section class="panel compact">
            <div class="panel-title">학급 경제 요약</div>
            <div class="money-row">
              <div>
                <span>총 골드</span>
                <strong id="totalGold">-</strong>
              </div>
              <div>
                <span>총 다이아</span>
                <strong id="totalDiamonds">-</strong>
              </div>
            </div>
          </section>
        </section>

        <section id="errorPanel" class="panel error-panel hidden">
          <div class="panel-title">불러오지 못했습니다</div>
          <p id="errorMessage"></p>
          <button id="retryBtn" class="primary-btn">다시 시도</button>
        </section>
      </main>
    </div>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
