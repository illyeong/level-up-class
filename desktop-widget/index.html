<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src https://level-up-class.firebaseapp.com https://accounts.google.com;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LevelUp Class 위젯</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="titlebar">
        <div class="drag-area">
          <div class="brand-mark">Lv</div>
          <div>
            <div class="title">LevelUp Class</div>
            <div class="subtitle">교사용 미니 위젯</div>
          </div>
        </div>
        <div class="window-actions">
          <button id="pinBtn" class="icon-btn" title="항상 위">P</button>
          <button id="minBtn" class="icon-btn" title="최소화">-</button>
          <button id="closeBtn" class="icon-btn danger" title="닫기">x</button>
        </div>
      </header>

      <main class="content">

        <!-- ── 로그인/연결 패널 ── -->
        <section id="setupPanel" class="panel setup-panel hidden">
          <div id="stateLogin">
            <div class="panel-title">교사 계정 연결</div>
            <p class="help">구글 계정으로 로그인하면 담당 학급이 자동 연결됩니다.</p>
            <button id="googleSignInBtn" class="primary-btn google-btn">구글로 로그인</button>
          </div>
          <div id="stateLoading" class="hidden">
            <div class="panel-title">연결 중...</div>
            <p class="help">잠시만 기다려 주세요.</p>
          </div>
          <div id="statePick" class="hidden">
            <div class="panel-title">학급 선택</div>
            <p class="help">담당 학급을 선택해 주세요.</p>
            <div id="classPickList" class="class-pick-list"></div>
          </div>
          <div id="stateError" class="hidden">
            <div class="panel-title">연결 실패</div>
            <p id="setupErrMsg" class="error-text"></p>
            <button id="retryLoginBtn" class="primary-btn">다시 시도</button>
          </div>
          <div id="disconnectArea" class="disconnect-area hidden">
            <button id="disconnectBtn" class="small-btn">연결 해제</button>
          </div>
        </section>

        <!-- ── 대시보드 패널 ── -->
        <section id="dashboardPanel" class="hidden">
          <div class="class-card">
            <div>
              <div id="className" class="class-name">학급 불러오는 중</div>
              <div id="classMeta" class="class-meta">-</div>
            </div>
            <button id="settingsBtn" class="small-btn">⚙ 설정</button>
          </div>

          <div class="quick-row">
            <button data-open="dashboard" class="quick-btn">웹 대시보드</button>
            <button id="quickQuestBtn" class="quick-btn">퀘스트</button>
            <button id="quickNotesBtn" class="quick-btn">배움노트</button>
          </div>

          <section class="metric-grid">
            <article class="metric-card blue">
              <div class="metric-label">학생 수</div>
              <div id="studentCount" class="metric-value">-</div>
            </article>
            <article class="metric-card amber">
              <div class="metric-label">오늘 퀘스트</div>
              <div id="questToday" class="metric-value">-</div>
            </article>
            <article class="metric-card rose">
              <div class="metric-label">승인 대기</div>
              <div id="pendingNotes" class="metric-value">-</div>
            </article>
            <article class="metric-card emerald">
              <div class="metric-label">오늘 활동</div>
              <div id="todayActivity" class="metric-value">-</div>
            </article>
          </section>

          <section class="panel">
            <div class="section-head">
              <div>
                <div class="panel-title">지금 확인할 일</div>
                <div id="lastUpdated" class="caption">-</div>
              </div>
              <button id="refreshBtn" class="small-btn">새로고침</button>
            </div>
            <div id="todoList" class="todo-list"></div>
          </section>

          <section class="panel">
            <div class="panel-title">진행 중인 보스레이드</div>
            <div id="raidList" class="raid-list"></div>
          </section>

          <section class="panel compact">
            <div class="panel-title">학급 경제 요약</div>
            <div class="money-row">
              <div><span>총 골드</span><strong id="totalGold">-</strong></div>
              <div><span>총 다이아</span><strong id="totalDiamonds">-</strong></div>
            </div>
          </section>
        </section>

        <!-- ── 퀘스트 패널 ── -->
        <section id="questPanel" class="hidden">
          <div class="sub-header">
            <button class="back-btn" data-target="dashboardPanel">← 뒤로</button>
            <span class="sub-title">퀘스트 현황</span>
            <button id="questRefreshBtn" class="small-btn">↻</button>
          </div>
          <div id="questContent" class="sub-content"></div>
        </section>

        <!-- ── 배움노트 패널 ── -->
        <section id="notesPanel" class="hidden">
          <div class="sub-header">
            <button class="back-btn" data-target="dashboardPanel">← 뒤로</button>
            <span class="sub-title">배움노트</span>
            <button id="notesRefreshBtn" class="small-btn">↻</button>
          </div>
          <div id="notesContent" class="sub-content"></div>
        </section>

        <!-- ── 설정 패널 ── -->
        <section id="settingsPanel" class="hidden">
          <div class="sub-header">
            <button class="back-btn" data-target="dashboardPanel">← 뒤로</button>
            <span class="sub-title">설정</span>
          </div>

          <div id="settingsClassCard" class="panel" style="margin-top:10px;"></div>

          <div class="panel" style="margin-top:10px;">
            <div class="settings-row">
              <span>항상 위에 표시</span>
              <button id="pinToggleSetting" class="toggle-btn">OFF</button>
            </div>
          </div>

          <div class="panel" style="margin-top:10px;">
            <button id="openWebDashBtn" class="settings-link-btn">교사 대시보드 열기 ↗</button>
          </div>

          <div class="panel" style="margin-top:10px;">
            <button id="changeClassBtn" class="settings-action-btn">학급 변경</button>
            <button id="logoutBtn" class="settings-action-btn" style="margin-top:8px; color:#fca5a5;">로그아웃</button>
          </div>
        </section>

        <!-- ── 오류 패널 ── -->
        <section id="errorPanel" class="panel error-panel hidden">
          <div class="panel-title">불러오지 못했습니다</div>
          <p id="errorMessage"></p>
          <button id="retryBtn" class="primary-btn">다시 시도</button>
        </section>

      </main>
    </div>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
